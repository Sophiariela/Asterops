  <circle cx="62" cy="38" r="8" fill="#8A9A7E" opacity="0.85"/>
  <circle cx="55" cy="50" r="8" fill="#8B4A32" opacity="0.85"/>
  <g fill="#3A332C" opacity="0.55">
