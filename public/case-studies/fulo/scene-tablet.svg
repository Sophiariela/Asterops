    <rect x="828" y="38" width="28" height="4" rx="2"/>
    <rect x="828" y="46" width="28" height="4" rx="2"/>
  </g>

  <!-- hero -->
  <rect x="0" y="76" width="900" height="440" fill="url(#heroGradT)"/>
  <rect x="200" y="556" width="500" height="26" rx="6" fill="#3A332C" opacity="0.85"/>
  <rect x="270" y="598" width="360" height="14" rx="6" fill="#3A332C" opacity="0.35"/>
  <rect x="340" y="632" width="220" height="46" rx="23" fill="#C6633B"/>

