<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1266" role="img" aria-label="Placeholder preview of the Fulô Crochet storefront on mobile">
  <defs>
    <linearGradient id="heroGradM" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8C7B0"/>
      <stop offset="100%" stop-color="#C6633B"/>
    </linearGradient>
    <linearGradient id="cardGradM" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F1E4D3"/>
      <stop offset="100%" stop-color="#E3CBB0"/>
