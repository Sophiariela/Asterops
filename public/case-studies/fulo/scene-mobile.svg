    <rect x="196" y="802" width="360" height="16" rx="6" fill="#3A332C" opacity="0.6"/>
    <rect x="196" y="828" width="260" height="12" rx="6" fill="#3A332C" opacity="0.3"/>
    <rect x="196" y="880" width="84" height="20" rx="10" fill="#8B4A32" opacity="0.8"/>
  </g>
  <g>
    <rect x="40" y="972" width="140" height="140" rx="10" fill="url(#cardGradM)"/>
    <rect x="196" y="982" width="360" height="16" rx="6" fill="#3A332C" opacity="0.6"/>
