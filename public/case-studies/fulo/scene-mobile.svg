  </defs>

  <rect width="600" height="1266" fill="#F7EFE4"/>

  <!-- nav -->
  <rect x="0" y="0" width="600" height="64" fill="#FFFFFF"/>
  <rect x="0" y="63" width="600" height="1" fill="#E8DCC8"/>
  <circle cx="40" cy="32" r="7" fill="#C6633B" opacity="0.9"/>
  <circle cx="52" cy="32" r="7" fill="#8A9A7E" opacity="0.85"/>
  <g fill="#3A332C" opacity="0.55">
    <rect x="536" y="26" width="24" height="4" rx="2"/>
    <rect x="536" y="34" width="24" height="4" rx="2"/>
    <rect x="536" y="42" width="24" height="4" rx="2"/>
  </g>

  <!-- hero -->
  <rect x="0" y="64" width="600" height="360" fill="url(#heroGradM)"/>
  <rect x="60" y="448" width="480" height="24" rx="6" fill="#3A332C" opacity="0.85"/>
  <rect x="90" y="486" width="420" height="14" rx="6" fill="#3A332C" opacity="0.35"/>
  <rect x="150" y="516" width="300" height="46" rx="23" fill="#C6633B"/>

