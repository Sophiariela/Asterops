<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<nav style="position:sticky;top:0;z-index:50;height:64px;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:0 clamp(20px,5vw,72px);background:color-mix(in srgb, var(--color-bg) 80%, transparent);backdrop-filter:blur(12px);border-bottom:1px solid color-mix(in srgb, var(--color-divider) 60%, transparent);">
  <a href="Aster-Homepage.dc.html" style="display:flex;align-items:center;gap:9px;text-decoration:none;font-family:var(--font-mono);font-size:15px;font-weight:600;letter-spacing:-0.01em;color:var(--color-text);">
    <span style="display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:var(--radius-sm);border:1px solid color-mix(in srgb, var(--color-accent) 30%, transparent);background:color-mix(in srgb, var(--color-accent) 10%, transparent);color:var(--color-accent);flex-shrink:0;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 6v12"></path><path d="M17.196 9 6.804 15"></path><path d="M6.804 9l10.392 6"></path></svg>
    </span>
    Aster
  </a>
  <div style="display:flex;align-items:center;gap:32px;">
    <a href="Aster-Homepage.dc.html#solutions" aria-current="{{ solutionsCurrent }}" style="font-size:13.5px;font-weight:500;text-decoration:none;color:var(--color-neutral-400);" style-hover="color:var(--color-text);">Solutions</a>
    <a href="Aster-Homepage.dc.html#showcase" aria-current="{{ inspirationCurrent }}" style="font-size:13.5px;font-weight:500;text-decoration:none;color:var(--color-neutral-400);" style-hover="color:var(--color-text);">Showcase</a>
    <a href="Aster-Contact.dc.html" aria-current="{{ contactCurrent }}" style="font-size:13.5px;font-weight:500;text-decoration:none;color:var(--color-neutral-400);" style-hover="color:var(--color-text);">Contact</a>
    <a href="Aster-Client-Portal.dc.html" style="font-size:13.5px;font-weight:500;text-decoration:none;color:var(--color-neutral-500);" style-hover="color:var(--color-text);">Client Login</a>
    <a href="Aster-Contact.dc.html" class="btn btn-primary" style="text-decoration:none;height:36px;padding:0 18px;font-size:13.5px;">Start a Project</a>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:64},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;home&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;solutions&quot;,&quot;inspiration&quot;,&quot;contact&quot;],&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active || 'home';
    return {
      solutionsCurrent: active === 'solutions' ? 'page' : undefined,
      inspirationCurrent: active === 'inspiration' ? 'page' : undefined,
      contactCurrent: active === 'contact' ? 'page' : undefined,
    };
  }
}
</script>
</body>
</html>
