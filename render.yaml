services:
  - type: web
    name: asterops-api
    runtime: node
    plan: free
    rootDir: server
    # Pre-Deploy Command is a paid-plan feature, so on the free plan
    # migrations run as the last build step instead — safe to re-run on
    # every deploy since `prisma migrate deploy` no-ops once a migration
    # has already been applied.
    #
    # --include=dev is required here: NODE_ENV=production is set below (for
    # the runtime process), but Render applies service envVars during the
    # build step too. npm derives its `omit` config from NODE_ENV, so plain
    # `npm install` silently skips devDependencies (typescript, @types/*,
    # tsx) whenever NODE_ENV=production is present — breaking `tsc` with
    # "implicit any" / "could not find declaration file" errors even though
    # the build succeeds locally where NODE_ENV isn't set.
    buildCommand: npm install --include=dev && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 7d
      # Secrets and per-environment values below are intentionally left
      # unset here (sync: false) — set them in the Render dashboard instead
      # of committing them to the repo.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # WebOS Business Operations — all optional, see server/.env.example
      # for what each unlocks and where to get it. Every feature degrades
      # gracefully (console.log, or a 503 on connect) when unset.
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
